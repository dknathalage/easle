name: release

# OPTIONAL cross-platform build helper. The primary release path is local:
#   task release TAG=v0.1.1        (see Taskfile.yml — builds the host OS + publishes)
#
# This workflow is MANUAL (workflow_dispatch). Given an existing release tag as
# input, each matrix runner builds installers for its OWN OS/arch (no cross-
# compiling the native better-sqlite3 module) and uploads them to that release —
# handy for adding the Windows/Linux installers when you only have a Mac locally.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach installers to (e.g. v0.1.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14      # Apple Silicon (arm64)
          - os: macos-13      # Intel (x64)
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}   # build the exact released commit

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `npm install` (not `npm ci`): the committed lockfile only records the
      # host-platform rollup/native optional deps, so `npm ci` misses this OS's
      # binaries (npm/cli#4828). install reconciles them per-runner.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build installers
        run: npm run dist --workspace apps/desktop -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'  # unsigned builds — don't attempt signing

      - name: Upload installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd apps/desktop/release
          files=$(ls *.dmg *.exe *.AppImage *.deb 2>/dev/null || true)
          [ -n "$files" ] || { echo "No installers produced on ${{ matrix.os }}"; exit 1; }
          echo "Uploading: $files"
          gh release upload "${{ inputs.tag }}" $files --clobber --repo "$GITHUB_REPOSITORY"
