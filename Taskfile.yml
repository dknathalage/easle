version: '3'

# Easle dev + packaging tasks. Requires go-task (https://taskfile.dev).
#
#   task install        # install workspace deps
#   task rebuild        # rebuild better-sqlite3 for Electron's ABI (dev, first run)
#   task dev            # run Vite + Electron with HMR
#   task dist           # build a production Easle.app + .dmg (release/)
#   task install-local  # build + copy Easle.app into /Applications (prod install)
#   task open           # launch the installed app
#   task mcp:check      # curl the embedded MCP server (app must be running)
#   task release        # Conventional-Commit version + CHANGELOG, build all platforms, publish
#   task release BUMP=minor   # ...force the bump level (else auto-derived from commits)

vars:
  DESKTOP: apps/desktop
  RELEASE: apps/desktop/release
  APP_NAME: Easle.app
  INSTALL_DIR: /Applications
  MCP_URL: http://127.0.0.1:47600/mcp

tasks:
  default:
    cmds:
      - task --list
    silent: true

  install:
    desc: Install workspace dependencies
    cmds:
      - npm install

  rebuild:
    desc: Rebuild native modules (better-sqlite3) for Electron's ABI — dev only
    cmds:
      - npm run rebuild --workspace {{.DESKTOP}}

  dev:
    desc: Run Vite + Electron with hot reload
    cmds:
      - npm run dev --workspace {{.DESKTOP}}

  build:
    desc: Build the renderer only (Vite → apps/desktop/dist)
    cmds:
      - npm run build --workspace {{.DESKTOP}}

  dist:
    desc: Build a production Easle.app + .dmg into apps/desktop/release/
    cmds:
      - npm run dist --workspace {{.DESKTOP}}
      - 'echo "Artifacts:" && find {{.RELEASE}} -maxdepth 2 -name "*.dmg" -o -maxdepth 2 -name "{{.APP_NAME}}"'

  dist:dir:
    desc: Build the unpacked production .app only (no .dmg — faster)
    cmds:
      - npm run dist:dir --workspace {{.DESKTOP}}

  install-local:
    desc: Build the prod app and install it into /Applications
    deps: [dist:dir]
    cmds:
      - |
        APP="$(find {{.RELEASE}} -maxdepth 2 -name '{{.APP_NAME}}' -type d | head -1)"
        if [ -z "$APP" ]; then echo "Build produced no {{.APP_NAME}} — check the dist output"; exit 1; fi
        echo "Installing $APP → {{.INSTALL_DIR}}/{{.APP_NAME}}"
        rm -rf "{{.INSTALL_DIR}}/{{.APP_NAME}}"
        cp -R "$APP" "{{.INSTALL_DIR}}/{{.APP_NAME}}"
        # unsigned local build: clear the quarantine bit so Gatekeeper lets it open
        xattr -dr com.apple.quarantine "{{.INSTALL_DIR}}/{{.APP_NAME}}" 2>/dev/null || true
        echo "Installed. Launch with:  task open   (or open -a Easle)"

  open:
    desc: Launch the installed Easle app
    cmds:
      - open -a Easle

  uninstall:
    desc: Remove Easle from /Applications
    cmds:
      - rm -rf "{{.INSTALL_DIR}}/{{.APP_NAME}}"
      - echo "Removed {{.INSTALL_DIR}}/{{.APP_NAME}}"

  mcp:check:
    desc: List the embedded MCP tools (the app must be running)
    cmds:
      - |
        curl -sS -X POST {{.MCP_URL}} \
          -H 'content-type: application/json' \
          -H 'accept: application/json, text/event-stream' \
          -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'

  release:preflight:
    desc: "Verify a clean working tree on main, identical to origin/main, and gh is authed"
    cmds:
      - |
        set -e
        command -v gh >/dev/null 2>&1 || { echo "gh (GitHub CLI) is required and must be authed."; exit 1; }
        gh auth status >/dev/null 2>&1 || { echo "gh is not authenticated — run 'gh auth login'."; exit 1; }
        BR="$(git rev-parse --abbrev-ref HEAD)"
        [ "$BR" = "main" ] || { echo "On '$BR', not main — releases are cut from main."; exit 1; }
        if [ -n "$(git status --porcelain)" ]; then
          echo "Working tree is not clean — commit or stash first:"; git status --short; exit 1
        fi
        git fetch --quiet origin main
        LOCAL="$(git rev-parse HEAD)"; REMOTE="$(git rev-parse origin/main)"
        [ "$LOCAL" = "$REMOTE" ] || { echo "Local main ($LOCAL) != origin/main ($REMOTE). Push/pull so they match."; exit 1; }
        echo "Preflight OK: clean main @ $(git rev-parse --short HEAD) == origin/main"

  release:
    desc: "Version + changelog from Conventional Commits, build all platforms, publish: task release [BUMP=patch|minor|major]"
    deps: [release:preflight]
    cmds:
      - |
        set -e
        # 1) Bump the version and update CHANGELOG.md from Conventional Commits.
        #    Auto-derives the semver level (feat->minor, fix->patch, ! ->major);
        #    pass BUMP=patch|minor|major to force it. Commits + tags (no push).
        RELEASE_AS=""; [ -n "{{.BUMP}}" ] && RELEASE_AS="--release-as {{.BUMP}}"
        npx commit-and-tag-version $RELEASE_AS
        NEWVER="$(node -p "require('./{{.DESKTOP}}/package.json').version")"
        TAG="v${NEWVER}"
        # If the build fails below, undo the release commit + tag so it's a no-op.
        trap 'echo "Build failed — undoing release commit/tag $TAG."; git tag -d "$TAG" 2>/dev/null || true; git reset --hard HEAD~1' ERR
        echo "==> Releasing $TAG"

        # 2) Clean output, then build installers for macOS + Windows + Linux.
        rm -rf {{.RELEASE}}
        npm run dist --workspace {{.DESKTOP}} -- --mac --win --linux --publish never

        # 3) Collect the installers (fail — and revert — if none were produced).
        FILES="$(ls {{.RELEASE}}/*.dmg {{.RELEASE}}/*.exe {{.RELEASE}}/*.AppImage {{.RELEASE}}/*.deb 2>/dev/null || true)"
        [ -n "$FILES" ] || { echo "No installers produced in {{.RELEASE}}."; exit 1; }
        echo "==> Built:"; echo "$FILES" | sed 's/^/    /'

        # 4) Push commit + tag, then publish with this version's changelog section.
        git push --follow-tags origin main
        NOTES="$(awk '/^## /{c++} c==1{print} c==2{exit}' CHANGELOG.md)"
        gh release create "$TAG" $FILES --title "$TAG" --notes "$NOTES"
        trap - ERR
        echo "==> Published $TAG: $(gh release view "$TAG" --json url -q .url)"

  clean:
    desc: Remove build output (release/ and dist/)
    cmds:
      - rm -rf {{.RELEASE}} {{.DESKTOP}}/dist
      - echo "Cleaned build output (kept node_modules and data/)."
